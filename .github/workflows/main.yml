on: [ pull_request, push ]
name: ci
jobs:
  check-pr:
    name: validate commits
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - run: git fetch origin master
    - uses: flux-framework/pr-validator@master

  checkpatch:
    name: kernel style check
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: check style
      run: make -C driver check

  build-driver-rpi:
    name: build driver against Raspberry Pi OS Trixie kernel headers
    runs-on: ubuntu-26.04-arm
    steps:
    - name: add Raspberry Pi apt repository
      run: |
        curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key \
          | sudo gpg --dearmor -o /usr/share/keyrings/raspberrypi-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.gpg] https://archive.raspberrypi.com/debian/ trixie main" \
          | sudo tee /etc/apt/sources.list.d/raspberrypi.list
        sudo apt-get update
    - name: install Raspberry Pi kernel headers
      run: sudo apt-get install -y linux-headers-rpi-v8
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: build driver
      run: |
        KVER=$(ls /lib/modules | grep -- '-rpi-v8$' | sort -V | tail -1)
        echo "building against $KVER"
        make -C driver KERNEL_VERSION=$KVER

  load-driver-latest:
    name: build driver against running kernel and load it
    runs-on: ubuntu-26.04
    steps:
    - name: install libelf-dev
      run: sudo apt-get -y install libelf-dev
    - name: install linux-headers
      run: sudo apt-get install linux-headers-$(uname -r)
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: build driver
      run: make -C driver
    - name: clear kernel log messages
      run: sudo dmesg --clear
    - name: load parport module
      run: sudo insmod driver/parport/parport.ko
    - name: load driver
      run: sudo insmod driver/parport_gpio.ko
    - name: print kernel log messages
      if: always()
      run: sudo dmesg
    - name: unload kernel modules
      if: always()
      run: sudo rmmod parport_gpio parport

  check-hardware-v5:
    name: check v5 hardware
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
        sudo apt-get update
        sudo apt-get install -y \
            make \
            kicad=9.0.9*
    - name: initialize kicad config
      run: |
        mkdir -p $HOME/.config/kicad/9.0
        cp /usr/share/kicad/template/fp-lib-table $HOME/.config/kicad/9.0/
        cp /usr/share/kicad/template/sym-lib-table $HOME/.config/kicad/9.0/
    - name: display kicad version
      run: |
        echo "Kicad:"
        kicad-cli --version
    - name: ERC
      run: |
        make -C hardware/v5 check_erc
    - name: DRC
      run: |
        make -C hardware/v5 check_drc
